<!DOCTYPE html>
<html>
    <head>
        <title>Calificaciones</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
        <body>
            <main>
                <div class="container mt-3">
                    <h2>Formulario de calificaciones</h2>
                    <form action="#">
                        <div class="mb-3 mt-3">
                        <label for="nombre">Nombre:</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Nombre" name="nombre">
                        </div>
                        <div class="mb-3 mt-3">
                            <label for="matricula">Matricula:</label>
                            <input type="number" class="form-control" id="matricula" placeholder="Matricula" name="matricula">
                        </div>
                        <div class="mb-3 mt-3">
                            <label for="unidad1">Calificación 1:</label>
                            <input type="number" class="form-control" id="unidad1" placeholder="Calificacion 1" name="cal1">
                        </div>
                        <div class="mb-3 mt-3">
                            <label for="unidad2">Calificación 2:</label>
                            <input type="number" class="form-control" id="unidad2" placeholder="Calificacion 2" name="cal2">
                        </div>
                        <div class="mb-3 mt-3">
                            <label for="unidad3">Calificación 3:</label>
                            <input type="number" class="form-control" id="unidad3" placeholder="Calificacion 3" name="cal3">
                        </div>
                        <button type="button" class="btn btn-primary" onclick="mostrarResultado()">Ver promedio</button>
                    </form>
                    </div>
                <script src="js/script.js"></script>  
            </main>
        </body>
</html>
