<!DOCTYPE html>
<html>
    <head>
        <title>Formulario de compra</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <main>
            <div class="container mt-3">
                <h2>Formulario de compra</h2>
                <form action="#">
                    <div class="mb-3 mt-3">
                        <label for="nombre">Nombre:</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Nombre del cliente" name="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label for="producto">Producto:</label>
                        <input type="text" class="form-control" id="producto" placeholder="Ingrese el producto" name="producto" required>
                    </div>
                    <div class="mb-3">
                        <label for="precio">Precio unitario:</label>
                        <input type="number" class="form-control" id="precio" placeholder="Ingrese el precio" name="precio" required>
                    </div>
                    <div class="mb-3">
                        <label for="cantidad">Cantidad:</label>
                        <input type="number" class="form-control" id="cantidad" placeholder="Ingrese la cantidad" name="cantidad" required>
                    </div>
                        <button type="button" class="btn btn-primary" onclick="mostrarTicket()">Hacer compra</button>
                    </form>
                </div>
                <script src="js/script.js"></script>
        </main>
    </body>
</html>
