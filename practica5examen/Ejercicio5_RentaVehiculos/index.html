<!DOCTYPE html>
<html>
    <head>
        <title></title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <main>
            <div class="container mt-3">
                <h2>Formulario de renta de vehiculo:</h2>
                <form action="#">
                <div class="mb-3 mt-3">
                    <label for="cliente">Cliente:</label>
                    <input type="text" class="form-control" id="cliente" placeholder="Nombre del cliente" name="cliente">
                </div>
                <div class="container mt-3">
                    <h2>Tipo de vehiculo</h2>
                <label for="tipoVehiculo" class="form-label">Selecciona un tipo de vehiculo:</label>
                    <select class="form-select" id="tipoVehiculo" name="tipoVehiculo">
                    <option>Camioneta</option>
                    <option>SUV</option>
                    <option>Economico</option>
                    </select>
                    <br>
                </div>
                <div class="mb-3">
                    <label for="diasRenta">Dias de renta del vehiculo:</label>
                    <input type="number" class="form-control" id="diasRenta" placeholder="Dias de renta" name="diasRenta">
                </div>
                <div class="form-check mb-3">
                    <label class="form-check-label">
                    <input class="form-check-input" type="checkbox" name="seguro" id="seguroAdicional"> Seguro adicional
                    </label>
                </div>
                <button type="button" class="btn btn-primary" onclick="mostrarContrato()">Procesar</button>
                </form>
            </div>
            <script src="js/script.js"></script>
        </main>
    </body>
</html>
